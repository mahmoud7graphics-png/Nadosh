<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#faf5f7">
    <title>الاختبار - لعبة صغيرة</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&family=Playfair+Display:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
    <div class="background-particles" id="particles"></div>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>

    <div class="floating-header">
        <a href="memories.html" class="header-btn back-btn" aria-label="رجوع"><i class="fas fa-arrow-right"></i></a>
        <button class="header-btn" onclick="showNotifications()" aria-label="الإشعارات"><i class="fas fa-bell"></i><span class="notification-badge">3</span></button>
    </div>

    <div class="modal-overlay" id="notificationsModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeNotifications()"><i class="fas fa-times"></i></button>
            <h3 style="text-align:center;margin-bottom:1rem;">الإشعارات</h3>
            <div style="display:flex;flex-direction:column;gap:0.8rem;">
                <div style="padding:1rem;background:var(--soft-pink);border-radius:1rem;text-align:center;">رسالة جديدة تنتظرك!</div>
                <div style="padding:1rem;background:var(--soft-blue);border-radius:1rem;text-align:center;">أنتِ شخص رائع!</div>
                <div style="padding:1rem;background:var(--soft-mint);border-radius:1rem;text-align:center;">افتحي المفاجأة النهائية</div>
            </div>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <div class="page active" id="page1">
            <div class="section-title">
                <h2>اختبار سريع</h2>
                <p>اختاري ما يناسبك.. لا توجد إجابات خاطئة</p>
            </div>
            <div class="quiz-modern">
                <div class="quiz-progress">
                    <div class="quiz-step active" id="quizStep1">1</div>
                    <div class="quiz-step" id="quizStep2">2</div>
                    <div class="quiz-step" id="quizStep3">3</div>
                </div>
                <div class="quiz-question" id="quizQuestion">ما هو أفضل وقت في اليوم بالنسبة لكِ؟</div>
                <div class="quiz-options" id="quizOptions">
                    <div class="quiz-option" onclick="selectQuizOption(this)"><i class="fas fa-sun"></i> الصباح الباكر</div>
                    <div class="quiz-option" onclick="selectQuizOption(this)"><i class="fas fa-cloud-sun"></i> الظهيرة</div>
                    <div class="quiz-option" onclick="selectQuizOption(this)"><i class="fas fa-moon"></i> المساء</div>
                    <div class="quiz-option" onclick="selectQuizOption(this)"><i class="fas fa-star"></i> منتصف الليل</div>
                </div>
                <div id="quizFeedback" style="margin-top:1rem;padding:1rem;border-radius:1rem;background:var(--soft-mint);display:none;"></div>
            </div>
            <div class="navigation-buttons">
                <a href="memories.html" class="btn btn-outline"><i class="fas fa-arrow-right"></i> السابق</a>
                <a href="letter.html" class="btn btn-primary" id="quizNextBtn" style="pointer-events:none;opacity:0.4;">التالي <i class="fas fa-arrow-left"></i></a>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-btn"><i class="fas fa-home"></i></a>
        <a href="memories.html" class="nav-btn"><i class="fas fa-heart"></i></a>
        <a href="quiz.html" class="nav-btn active"><i class="fas fa-gamepad"></i></a>
        <a href="letter.html" class="nav-btn"><i class="fas fa-envelope"></i></a>
        <a href="finale.html" class="nav-btn"><i class="fas fa-gift"></i></a>
    </div>

    <script src="js/quiz.js"></script>
</body>
</html>
